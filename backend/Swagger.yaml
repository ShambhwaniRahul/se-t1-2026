openapi: 3.0.3
info:
  title: Your API
  version: 1.0.0
  description: |
    # API Documentation

    This API powers the backend for the procurement and inventory system.

    ## User Stories Mapping
  
    - As an Owner, I can manage employees and assign roles at localhost:8000/api/v1/hr/auth/employees .
    - As a Manager, I can create and manage purchase orders, and track inventory at localhost:8000/api/v1/procurement/purchase-orders.
    - As a Store Manager, I can update stock levels after receiving goods at localhost:8000/api/v1/inventory/perishable-inventory.
    - As a Chef, I can create and manage customer orders at localhost:8000/api/v1/pos/orders.
    - As a Waiter, I can update the status of menu items within an order at localhost:8000/api/v1/pos/orders/<int:order_id>/menuitems/<int:pk>.
  
    ## Key Workflows
  
    1. Purchase Order is created by Manager
    2. Vendor delivers the ordered items
    3. Vendor invoice is generated and recorded
    4. Inventory is updated based on received goods
  
    ## Authentication
  
    This API uses JWT-based authentication.
  
    - Obtain tokens via `/api/token/`
    - Refresh tokens via `/api/token/refresh/`
    - Include access token in Authorization header:
      ```
      Authorization: Bearer <access_token>
      ```

