components:
  schemas:
    AttendanceLog:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        shift:
          type: integer
        employee_name:
          type: string
          readOnly: true
        entry_time:
          type: string
          format: date-time
        exit_time:
          type: string
          format: date-time
        entry_delay:
          type: string
          readOnly: true
        early_exit:
          type: string
          readOnly: true
        completed_work_hours:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - completed_work_hours
      - created_at
      - early_exit
      - employee_name
      - entry_delay
      - entry_time
      - exit_time
      - id
      - shift
      - updated_at
    CategoryEnum:
      enum:
      - 0
      - 1
      - 2
      - 3
      type: integer
      description: |-
        * `0` - Starter
        * `1` - Main Course
        * `2` - Dessert
        * `3` - Beverage
    Customer:
      type: object
      description: Transforms Customer model instances into JSON payloads and validates
        incoming structural data.
      properties:
        id:
          type: integer
          readOnly: true
        phone_no:
          type: string
          maxLength: 10
        first_name:
          type: string
          maxLength: 100
        last_name:
          type: string
          maxLength: 100
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - first_name
      - id
      - last_name
      - phone_no
      - updated_at
    CustomerPayment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        payment_mode:
          allOf:
          - $ref: '#/components/schemas/PaymentModeEnum'
          minimum: -2147483648
          maximum: 2147483647
        payment_mode_display:
          type: string
          readOnly: true
        order:
          type: integer
        order_id:
          type: integer
          readOnly: true
        customer:
          type: integer
        customer_name:
          type: string
          readOnly: true
        earned_loyalty_points:
          type: integer
          readOnly: true
        usage_type:
          allOf:
          - $ref: '#/components/schemas/UsageTypeEnum'
          minimum: -2147483648
          maximum: 2147483647
        usage_type_display:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - customer
      - customer_name
      - earned_loyalty_points
      - id
      - order
      - order_id
      - payment_mode
      - payment_mode_display
      - updated_at
      - usage_type
      - usage_type_display
    DiningTable:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        table_number:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        total_seats:
          type: integer
