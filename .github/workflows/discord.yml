name: Discord Notification

on:
  push:
  pull_request:
    types: [opened, closed, reopened]
  issues:
    types: [opened, closed]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send message to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          EVENT="${{ github.event_name }}"
          MESSAGE=""

          if [ "$EVENT" = "push" ]; then
            MESSAGE="🚀 New Push\n👤 Author: ${{ github.actor }}\n🌿 Branch: ${{ github.ref_name }}\n📝 Commit: ${{ github.event.head_commit.message }}"

          elif [ "$EVENT" = "pull_request" ]; then
            ACTION="${{ github.event.action }}"
            MERGED="${{ github.event.pull_request.merged }}"

            if [ "$ACTION" = "closed" ] && [ "$MERGED" = "true" ]; then
              STATUS="🔀 PR Merged"
            elif [ "$ACTION" = "closed" ]; then
              STATUS="❌ PR Closed"
            elif [ "$ACTION" = "reopened" ]; then
              STATUS="♻️ PR Reopened"
            else
              STATUS="📥 PR Opened"
            fi

            MESSAGE="$STATUS\n👤 PR Author: ${{ github.actor }}\n📌 PR Title: ${{ github.event.pull_request.title }}\n🌿 Branch: ${{ github.event.pull_request.head.ref }} → ${{ github.event.pull_request.base.ref }}\n🔗 URL: ${{ github.event.pull_request.html_url }}"

          elif [ "$EVENT" = "issues" ]; then
            ACTION="${{ github.event.action }}"

            if [ "$ACTION" = "opened" ]; then
              STATUS="🆕 Issue Opened"
            elif [ "$ACTION" = "closed" ]; then
              STATUS="✅ Issue Closed"
            else
              STATUS="ℹ️ Issue Updated"
            fi

            MESSAGE="$STATUS\n👤 Issue Creator: ${{ github.actor }}\n📌 Issue Title: ${{ github.event.issue.title }}\n🔗 URL: ${{ github.event.issue.html_url }}"
          fi

          # Proper JSON encoding using jq
          curl -H "Content-Type: application/json" \
          -X POST \
          -d "$(jq -n --arg content "$MESSAGE" '{content: $content}')" \
          $WEBHOOK
