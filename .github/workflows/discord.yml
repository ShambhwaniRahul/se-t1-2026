name: Discord Notification

on:
  push:
  pull_request:
    types: [opened, closed, reopened]
  issues:
    types: [opened, closed]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send message to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          EVENT="${{ github.event_name }}"

          # Pre-assign variables (safe)
          ACTOR="${{ github.actor }}"
          BRANCH="${{ github.ref_name }}"
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          PR_TITLE="${{ github.event.pull_request.title }}"
          PR_URL="${{ github.event.pull_request.html_url }}"
          PR_HEAD="${{ github.event.pull_request.head.ref }}"
          PR_BASE="${{ github.event.pull_request.base.ref }}"
          ISSUE_TITLE="${{ github.event.issue.title }}"
          ISSUE_URL="${{ github.event.issue.html_url }}"

          # Extract issue labels (comma-separated)
          ISSUE_LABELS=$(jq -r '[.labels[].name] | join(", ")' <<< "${{ toJSON(github.event.issue.labels) }}")
          if [ -z "$ISSUE_LABELS" ]; then
            ISSUE_LABELS="None"
          fi

          if [ "$EVENT" = "push" ]; then
            MESSAGE=$(printf "🚀 **New Push detected**\n👤 Author: %s\n🌿 Branch: %s\n📝 Commit: %s" \
              "$ACTOR" "$BRANCH" "$COMMIT_MSG")

          elif [ "$EVENT" = "pull_request" ]; then
            ACTION="${{ github.event.action }}"
            MERGED="${{ github.event.pull_request.merged }}"

            if [ "$ACTION" = "closed" ] && [ "$MERGED" = "true" ]; then
              STATUS="🔀 PR Merged"
            elif [ "$ACTION" = "closed" ]; then
              STATUS="❌ PR Closed"
            elif [ "$ACTION" = "reopened" ]; then
              STATUS="♻️ PR Reopened"
            else
              STATUS="📥 PR Opened"
            fi

            MESSAGE=$(printf "%s\n👤 PR Author: %s\n📌 PR Title: %s\n🌿 Branch: %s → %s\n🔗 URL: %s" \
              "$STATUS" "$ACTOR" "$PR_TITLE" "$PR_HEAD" "$PR_BASE" "$PR_URL")

          elif [ "$EVENT" = "issues" ]; then
            ACTION="${{ github.event.action }}"

            if [ "$ACTION" = "opened" ]; then
              STATUS="🆕 Issue Opened"
            elif [ "$ACTION" = "closed" ]; then
              STATUS="✅ Issue Closed"
            else
              STATUS="ℹ️ Issue Updated"
            fi

            MESSAGE=$(printf "%s\n👤 Issue Creator: %s\n📌 Issue Title: %s\n🏷️ Labels: %s\n🔗 URL: %s" \
              "$STATUS" "$ACTOR" "$ISSUE_TITLE" "$ISSUE_LABELS" "$ISSUE_URL")
          fi

          curl -H "Content-Type: application/json" \
          -X POST \
          -d "$(jq -n --arg content "$MESSAGE" '{content: $content}')" \
          $WEBHOOK
